<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Your Account</title>
    </head>
    <body>

        {% extends 'base.html' %}

        {% block title %}
            Edit Your Account
        {% endblock %}

        {% block content %}

        <h1>Edit Your Account</h1>

        <form action="{% url 'edit_account' %}" method="POST" enctype="multipart/form-data">
            {% if error %}
                <p style="color:red;">{{ error }}</p>
            {% endif %}

            {% csrf_token %}

            <label for="username">Username:</label>

            <input type="text" id="username" name="username" value="{{ request.user.username }}" autocomplete="username"><br><br>

            <label for="email">Email:</label>

            <input type="email" id="email" name="email" value="{{ request.user.email }}" autocomplete="email"><br><br>

            <label>Current Password:</label>
            <input type="password" name="current_password" autocomplete="current_password"><br><br>

            <label for="password">Password:</label>

            <input type="password" id="password" name="password" autocomplete="new-password"><br><br>

            <label for="verify_password">Verify Password:</label>

            <input type="password" id="verify_password" name="verify_password" autocomplete="new-password">

            <input type="submit" value="Update Account">

        </form>

        {% endblock %}
        
    </body>
</html>
