{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
    <h1>Create Account</h1>

    <form method="post">
        {% csrf_token %}

        <label for="first_name">First Name</label><br>
        <input type="text" id="first_name" name="first_name" required>
        <br><br>

        <label for="last_name">Last Name</label><br>
        <input type="text" id="last_name" name="last_name" required>
        <br><br>

        <label for="date_of_birth">Date of Birth</label><br>
        <input type="date" id="date_of_birth" name="date_of_birth" required>
        <br><br>

        <label for="phone_number">Phone Number</label><br>
        <input type="tel" id="phone_number" name="phone_number" required>
        <br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="username">Username</label><br>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="confirm_password">Confirm Password</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <br><br>

        <label for="insurance">Insurance</label><br>
        <select id="insurance" name="insurance" required>
            <option value="">Select Insurance</option>
            <option value="Kaiser Permanente">Kaiser Permanente</option>
            <option value="IEHP">IEHP</option>
            <option value="Medicare">Medicare</option>
            <option value="Medi-Cal">Medi-Cal</option>
            <option value="Blue Shield">Blue Shield</option>
            <option value="Anthem Blue Cross">Anthem Blue Cross</option>
            <option value="Aetna">Aetna</option>
        </select>
        <br><br>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="#">Login</a>
    </p>
{% endblock %}
