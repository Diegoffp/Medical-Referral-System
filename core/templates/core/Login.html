{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static '/CSS/style.css' %}">
    <link rel="icon" type="image/x-icon"
      href="{% static '/favicon_io_4/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32"
      href="{% static '/favicon_io_4/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16"
      href="{% static '/favicon_io_4/favicon-16x16.png' %}">
    <link rel="apple-touch-icon"
      href="{% static '/favicon_io_4/apple-touch-icon.png' %}">
    <link rel="manifest"
      href="{% static '/favicon_io_4/site.webmanifest' %}">
</head>
<body>
    <div class="main">

    <h1>Login page</h1>
        <h3>Enter your login credentials</h3>

        <form method="POST">
            {% csrf_token %}

        <label for="username">Username:</label>
        <input 
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required>

        <button type="submit">Submit</button>
        {% if error %}
        <p style="color: red;">{{ error }}</p>
        {% endif %}
        </form>
        <p>Not registered?
            <a href="{% url 'create_account' %}">Create an account</a>
        </p>
    </div>

</body>
</html>
{% endblock %}
