<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Referral App{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        nav { background: #2c3e50; padding: 1rem; }
        nav a { color: white; text-decoration: none; margin-right: 1.5rem; font-weight: bold; }
        main { padding: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'patient_placeholder' %}">Patient</a>
        <a href="{% url 'provider_placeholder' %}">Provider</a>
        <a href="/admin/">Admin</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
