{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Referral App{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        nav { background: #2c3e50; padding: 0.5rem 0.25rem; display: flex; align-items: center; gap: 1.5rem;}
        nav a { color: white; text-decoration: none; margin-right: 1.5rem; font-weight: bold; }
       
        nav a.logo { display: flex; align-items: center; margin-right: 0.5rem; }

        nav a.logo img { height: 80px; width: 80px; object-fit: contain; display: block; }

        main { padding: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'images/medconnect-logo.png' %}" alt="Med-connect">
        </a>

        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'portal' %}">Portal</a>
        <a href="{% url 'listings' %}">Listings</a>
        <a href="{% url 'appointments' %}">Appointments</a>
        <a href="/admin/">Admin</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
